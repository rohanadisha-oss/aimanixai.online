<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aimanix AI - Secret Admin Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    body { background: #030712; color: #f8fafc; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    .card { width: 100%; max-width: 650px; background: #0f172a; padding: 28px; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    h2 { color: #00f2fe; margin-bottom: 16px; text-align: center; font-size: 1.5rem; }
    h3 { color: #38bdf8; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 8px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 10px 0 4px; font-weight: 500; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; outline: none; transition: border 0.2s; }
    input:focus, textarea:focus { border-color: #00f2fe; }
    textarea { height: 80px; resize: vertical; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 16px; font-size: 15px; }
    .btn-save { background: #00f2fe; color: #030712; transition: filter 0.2s; }
    .btn-save:hover { filter: brightness(1.1); }
    .btn-logout { background: #ef4444; color: #fff; margin-top: 10px; }
    .hidden { display: none; }
    #msg { text-align: center; color: #38bdf8; font-size: 14px; margin-top: 12px; font-weight: 600; }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="card">
  <!-- লগইন সেকশন -->
  <div id="login-sec">
    <h2>Admin Dashboard Login</h2>
    <p style="color: #64748b; font-size: 13px; text-align: center; margin-bottom: 15px;">শুধুমাত্র পরিচালকের ব্যবহারের জন্য সুরক্ষিত</p>
    <label>Email Address</label>
    <input type="email" id="email" placeholder="admin@example.com">
    <label>Password</label>
    <input type="password" id="pass">
    <button class="btn-save" onclick="handleLogin()">প্রবেশ করুন</button>
  </div>

  <!-- এডিটর সেকশন -->
  <div id="editor-sec" class="hidden">
    <h2>Aimanix Content Manager</h2>

    <h3>ভিডিও ও ছবি লিংক</h3>
    <label>ভিডিও লিংক (Kapwing / YouTube / Shorts লিঙ্ক)</label>
    <input type="text" id="inp-video-url" placeholder="https://www.youtube.com/watch?v=... বা kapwing লিঙ্ক">

    <label>প্রোফাইল ছবির লিংক (Image URL)</label>
    <input type="text" id="inp-photo-url" placeholder="https://i.postimg.cc/...">

    <h3>কন্টাক্ট ও হোয়াটসঅ্যাপ</h3>
    <label>WhatsApp নম্বর (যেমন: 919143181401)</label>
    <input type="text" id="inp-wa">

    <label>মোবাইল নম্বর (বাংলা ফন্ট)</label>
    <input type="text" id="inp-phone-bn">

    <h3>বাংলা কনটেন্ট এডিট</h3>
    <label>হিরো নাম (বাংলা)</label>
    <input type="text" id="inp-bn-name">

    <label>প্রধান বিবরণ (Hero Description - বাংলা)</label>
    <textarea id="inp-bn-desc"></textarea>

    <label>ঠিকানা (বাংলা)</label>
    <input type="text" id="inp-bn-addr">

    <h3>English Content Edit</h3>
    <label>Hero Name (English)</label>
    <input type="text" id="inp-en-name">

    <label>Hero Description (English)</label>
    <textarea id="inp-en-desc"></textarea>

    <label>Address (English)</label>
    <input type="text" id="inp-en-addr">

    <button class="btn-save" id="save-btn" onclick="saveAllContent()">সবকিছু সেভ করুন (Save Changes)</button>
    <p id="msg"></p>
    <button class="btn-logout" onclick="handleLogout()">লগআউট</button>
  </div>
</div>

<script>
  // কনসোল থেকে নেওয়া আসল এবং সংশোধিত কনফিগ
  const firebaseConfig = {
    apiKey: "AIzaSyDPEd6BMIujKPYXrZcfjgH32p7LNfO9crc",
    authDomain: "aimanix-web.firebaseapp.com",
    projectId: "aimanix-web",
    storageBucket: "aimanix-web.firebasestorage.app",
    messagingSenderId: "301700378138",
    appId: "1:301700378138:web:dcbdec942d50986363eba3",
    measurementId: "G-J3VL3GBQGQ"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('login-sec').classList.add('hidden');
      document.getElementById('editor-sec').classList.remove('hidden');
      fetchInitialData();
    } else {
      document.getElementById('login-sec').classList.remove('hidden');
      document.getElementById('editor-sec').classList.add('hidden');
    }
  });

  async function handleLogin() {
    const e = document.getElementById('email').value.trim();
    const p = document.getElementById('pass').value;
    try {
      await auth.signInWithEmailAndPassword(e, p);
    } catch (err) {
      alert("লগইন ত্রুটি: " + err.message);
    }
  }

  function handleLogout() {
    auth.signOut();
  }

  async function fetchInitialData() {
    try {
      const doc = await db.collection('site_settings').doc('main_data').get();
      if (doc.exists) {
        const d = doc.data();
        document.getElementById('inp-wa').value = d.whatsapp || '919143181401';
        document.getElementById('inp-phone-bn').value = d.phoneBn || '৯১৪৩১৮১৪০১';
        document.getElementById('inp-photo-url').value = d.photo || '';
        document.getElementById('inp-video-url').value = d.videoUrl || '';

        if (d.bn) {
          document.getElementById('inp-bn-name').value = d.bn.heroName || 'আনোয়ার হোসেন';
          document.getElementById('inp-bn-desc').value = d.bn.heroDesc || '';
          document.getElementById('inp-bn-addr').value = d.bn.address || 'খেজুর ডাঙ্গা, দেগঙ্গা, বারাসাত, উত্তর ২৪ পরগণা, ৭৪৩৪২৩';
        }
        if (d.en) {
          document.getElementById('inp-en-name').value = d.en.heroName || 'Anowar Hossain';
          document.getElementById('inp-en-desc').value = d.en.heroDesc || '';
          document.getElementById('inp-en-addr').value = d.en.address || 'Khejurdanga, Deganga, Barasat, North 24 Parganas, 743423';
        }
      } else {
        document.getElementById('inp-wa').value = '919143181401';
        document.getElementById('inp-phone-bn').value = '৯১৪৩১৮১৪০১';
        document.getElementById('inp-photo-url').value = 'https://i.postimg.cc/wTcMTtJv/Screenshot-20260903-000545.jpg';
        document.getElementById('inp-video-url').value = 'https://www.kapwing.com/videos/6aa86a85413040be8d218f2b';
        document.getElementById('inp-bn-name').value = 'আনোয়ার হোসেন';
        document.getElementById('inp-en-name').value = 'Anowar Hossain';
        document.getElementById('inp-bn-addr').value = 'খেজুর ডাঙ্গা, দেগঙ্গা, বারাসাত, উত্তর ২৪ পরগণা, ৭৪৩৪২৩';
      }
    } catch (e) {
      console.error("Fetch Error:", e);
    }
  }

  async function saveAllContent() {
    const btn = document.getElementById('save-btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.innerText = "সংরক্ষণ করা হচ্ছে...";

    try {
      let payload = {
        whatsapp: document.getElementById('inp-wa').value,
        phoneBn: document.getElementById('inp-phone-bn').value,
        photo: document.getElementById('inp-photo-url').value,
        videoUrl: document.getElementById('inp-video-url').value,
        bn: {
          heroName: document.getElementById('inp-bn-name').value,
          heroDesc: document.getElementById('inp-bn-desc').value,
          address: document.getElementById('inp-bn-addr').value
        },
        en: {
          heroName: document.getElementById('inp-en-name').value,
          heroDesc: document.getElementById('inp-en-desc').value,
          address: document.getElementById('inp-en-addr').value
        }
      };

      await db.collection('site_settings').doc('main_data').set(payload, { merge: true });
      msg.innerText = "✓ সফলভাবে আপডেট হয়েছে! মূল সাইট স্বয়ংক্রিয়ভাবে পরিবর্তিত হয়েছে।";
    } catch (err) {
      alert("ত্রুটি হয়েছে: " + err.message);
      msg.innerText = "";
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
