<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এআই স্টুডিও - সিক্রেট অ্যাডমিন</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* লগইন বক্স */
    #authContainer {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 32px 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.8);
      text-align: center;
    }
    #authContainer h2 { font-size: 20px; color: #c084fc; margin-bottom: 6px; }
    #authContainer p { font-size: 13px; color: #9ca3af; margin-bottom: 22px; }
    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .input-group input:focus { border-color: #9333ea; }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* মূল ড্যাশবোর্ড */
    #studioDashboard {
      display: none;
      width: 100%;
      max-width: 480px;
      padding-bottom: 90px;
    }
    .top-bar-admin {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .top-bar-admin h1 { font-size: 18px; color: #c084fc; }
    .btn-logout {
      background: #374151;
      color: #ef4444;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .templates-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .card.active { border-color: #a855f7; background: #231245; }
    .card-icon { font-size: 26px; margin-bottom: 4px; }
    .card-name { font-size: 13px; font-weight: bold; color: #f1f5f9; }

    #previewBox {
      display: none;
      background: #131b2e;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid #38bdf8;
    }
    #previewBox img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .action-btns {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn-pub {
      background: #059669;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-can {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .bottom-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 460px;
      background: #131b2e;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .bottom-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
    }
    .submit-btn {
      background: #a855f7;
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

<!-- লগইন স্ক্রিন -->
<div id="authContainer">
  <h2>🔐 স্টুডিও লগইন</h2>
  <p>আপনার অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিন</p>
  <div class="input-group">
    <label>ইমেইল</label>
    <input type="email" id="adminEmail" placeholder="admin@example.com" required />
  </div>
  <div class="input-group">
    <label>পাসওয়ার্ড</label>
    <input type="password" id="adminPass" placeholder="••••••••" required />
  </div>
  <button class="btn-login" id="btnLogin" onclick="loginWithFirebase()">লগইন করুন</button>
</div>

<!-- মূল স্টুডিও ড্যাশবোর্ড -->
<div id="studioDashboard">
  <div class="top-bar-admin">
    <h1>✨ এআই পোস্টার স্টুডিও</h1>
    <button class="btn-logout" onclick="logoutFirebase()">লগআউট</button>
  </div>

  <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 10px;">টেমপ্লেট নির্বাচন করুন:</div>
  <div class="templates-grid">
    <div class="card active" onclick="setTemplate('ad_poster', this)">
      <div class="card-icon">🏛️</div>
      <div class="card-name">প্রতিষ্ঠান ব্যানার</div>
    </div>
    <div class="card" onclick="setTemplate('shop_offer', this)">
      <div class="card-icon">🛍️</div>
      <div class="card-name">দোকান ও অফার বিজ্ঞাপন</div>
    </div>
  </div>

  <div id="previewBox">
    <h3 style="color: #38bdf8; font-size: 15px; margin-bottom: 10px;">পোস্টার প্রিভিউ</h3>
    <img id="posterResultImg" src="" alt="Poster Preview" />
    <div class="action-btns">
      <button class="btn-pub" onclick="publishToAdsMarket()">✅ বিজ্ঞাপন বাজারে পোস্ট করুন</button>
      <button class="btn-can" onclick="document.getElementById('previewBox').style.display='none'">বাতিল</button>
    </div>
  </div>

  <div class="bottom-bar">
    <input type="text" id="promptText" placeholder="পোস্টারের বিবরণ বা প্রতিষ্ঠানের নাম..." />
    <button class="submit-btn" id="generateBtn" onclick="generatePoster()">➤</button>
  </div>
</div>

<script>
  // আপনার admin.html থেকে হুবহু Firebase Config বসাবেন
  const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "aimanixai.firebaseapp.com",
    projectId: "aimanixai",
    storageBucket: "aimanixai.appspot.com",
    messagingSenderId: "...",
    appId: "..."
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ইউজার অথেনটিকেশন স্টেট
  auth.onAuthStateChanged((user) => {
    if (user) {
      document.getElementById("authContainer").style.display = "none";
      document.getElementById("studioDashboard").style.display = "block";
      document.body.style.alignItems = "flex-start";
    } else {
      document.getElementById("authContainer").style.display = "block";
      document.getElementById("studioDashboard").style.display = "none";
      document.body.style.alignItems = "center";
    }
  });

  async function loginWithFirebase() {
    const email = document.getElementById("adminEmail").value.trim();
    const pass = document.getElementById("adminPass").value.trim();
    const btn = document.getElementById("btnLogin");

    if (!email || !pass) {
      alert("ইমেইল ও পাসওয়ার্ড উভয়ই দিন!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "যাচাই হচ্ছে...";

    try {
      await auth.signInWithEmailAndPassword(email, pass);
    } catch (err) {
      alert("লগইন ব্যর্থ: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "লগইন করুন";
    }
  }

  function logoutFirebase() {
    auth.signOut();
  }

  let selectedTemplate = "ad_poster";
  let finalPosterUrl = "";

  function setTemplate(type, el) {
    selectedTemplate = type;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  async function generatePoster() {
    const prompt = document.getElementById("promptText").value.trim();
    const btn = document.getElementById("generateBtn");

    if (!prompt) {
      alert("পোস্টারের বিবরণ লিখুন!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳";

    try {
      const res = await fetch("/api/generate-image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: prompt,
          templateType: selectedTemplate
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "ছবি তৈরি করা যায়নি");

      finalPosterUrl = data.imageUrl;
      document.getElementById("posterResultImg").src = finalPosterUrl;
      document.getElementById("previewBox").style.display = "block";

    } catch (err) {
      alert("ত্রুটি: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "➤";
    }
  }

  async function publishToAdsMarket() {
    if (!finalPosterUrl) return;
    const title = document.getElementById("promptText").value.trim() || "বিজ্ঞাপন ব্যানার";

    try {
      await db.collection("ads").add({
        title: title,
        imageUrl: finalPosterUrl,
        type: "poster",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert("🎉 বিজ্ঞাপন বাজারে পোস্টার সফলভাবে লাইভ হয়েছে!");
      document.getElementById("previewBox").style.display = "none";
      document.getElementById("promptText").value = "";
    } catch (err) {
      alert("পাবলিশ ব্যর্থ: " + err.message);
    }
  }
</script>
</body>
</html>
