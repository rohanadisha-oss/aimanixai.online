<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এআই বিজ্ঞাপন স্টুডিও | Aimanix AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0614;
      --card-bg: rgba(22, 14, 40, 0.7);
      --card-border: rgba(147, 51, 234, 0.3);
      --primary-purple: #9333ea;
      --primary-gradient: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%);
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(126, 34, 206, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 12px 30px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* হেডার ও ব্যাক বাটন */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .back-btn {
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(6, 182, 212, 0.3);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(6, 182, 212, 0.2);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 2px;
    }

    /* ক্যাটাগরি গ্রিড */
    .template-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .template-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .template-btn.active {
      border-color: #c084fc;
      background: rgba(147, 51, 234, 0.25);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.35);
    }

    .template-btn .icon {
      font-size: 20px;
      margin-bottom: 2px;
    }

    .template-btn .title {
      font-size: 14px;
      font-weight: 700;
    }

    .template-btn .subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* প্রিভিউ কার্ড */
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .preview-title {
      font-size: 14px;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .preview-box {
      width: 100%;
      height: 380px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn-live {
      flex: 2;
      background: #059669;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* ইনপুট কনসোল */
    .input-dock {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(10px);
    }

    .prompt-input {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      resize: none;
      outline: none;
      height: 52px;
      margin-bottom: 12px;
    }

    .prompt-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .dock-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .upload-label {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .upload-label input {
      display: none;
    }

    .generate-btn {
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s ease;
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- হেডার ও হোম পেজে ফেরার বাটন -->
    <div class="top-nav">
      <a href="ads.html" class="back-btn">
        <span>←</span> বিজ্ঞাপন বাজারে ফিরুন
      </a>
      <span class="brand-title">Aimanix Studio</span>
    </div>

    <!-- ক্যাটাগরি সিলেকশন -->
    <div class="section-title">ডিজাইন টেমপ্লেট নির্বাচন করুন:</div>
    <div class="template-grid">
      <button class="template-btn active" data-template="school">
        <span class="icon">🏛️</span>
        <span class="title">স্কুল/মাদ্রাসা ভর্তি</span>
        <span class="subtitle">এডমিশন ব্যানার ও ফ্লায়ার</span>
      </button>

      <button class="template-btn" data-template="shop">
        <span class="icon">🛍️</span>
        <span class="title">দোকান ও অফার</span>
        <span class="subtitle">সেলস ও ছাড় ব্যানার</span>
      </button>

      <button class="template-btn" data-template="jalsa">
        <span class="icon">🕌</span>
        <span class="title">জলসা ও মাহফিল</span>
        <span class="subtitle">ওয়াজ ও দ্বীনি প্রচারণা</span>
      </button>

      <button class="template-btn" data-template="eid">
        <span class="icon">🌙</span>
        <span class="title">ঈদ ও রমজান</span>
        <span class="subtitle">মোবারকবাদ ও শুভেচ্ছা</span>
      </button>

      <button class="template-btn" data-template="political">
        <span class="icon">📢</span>
        <span class="title">রাজনৈতিক পোস্টার</span>
        <span class="subtitle">প্রচারণা, সভা ও অভিনন্দন</span>
      </button>

      <button class="template-btn" data-template="custom">
        <span class="icon">🎨</span>
        <span class="title">কাস্টম প্রম্পট</span>
        <span class="subtitle">যেকোনো বিজ্ঞাপন আইডিয়া</span>
      </button>
    </div>

    <!-- পোস্টার প্রিভিউ সেকশন -->
    <div class="preview-card">
      <div class="preview-title">পোস্টার প্রিভিউ</div>
      <div class="preview-box" id="preview-box">
        <span class="placeholder-text" id="placeholder-text">পোস্টার এখানে প্রিভিউ হবে</span>
        <img id="preview-image" alt="পোস্টার প্রিভিউ">
      </div>

      <div class="action-group">
        <button class="btn-live" id="live-btn" onclick="publishLive()">✅ বিজ্ঞাপন বাজারে লাইভ করুন</button>
        <button class="btn-cancel" id="cancel-btn" onclick="cancelPreview()">বাতিল</button>
      </div>
    </div>

    <!-- ইনপুট ও কন্ট্রোল ডক -->
    <div class="input-dock">
      <textarea id="prompt-input" class="prompt-input" placeholder="আপনার বিজ্ঞাপনের বিবরণ ও তথ্য লিখুন (যেমন: স্কুলের নাম, ব্যাচ, যোগাযোগের নম্বর)..."></textarea>
      
      <div class="dock-actions">
        <label class="upload-label">
          📷 <span id="upload-text">ছবি যোগ করুন (ঐচ্ছিক)</span>
          <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)">
        </label>

        <button class="generate-btn" id="generate-btn" onclick="generatePoster()">
          <span id="btn-text">পোস্টার তৈরি ➤</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    let currentTemplate = 'school';
    let uploadedImageBase64 = null;
    let generatedImageUrl = '';

    // ক্যাটাগরি বাটন সিলেকশন
    document.querySelectorAll('.template-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTemplate = btn.dataset.template;
      });
    });

    // ছবি আপলোড রিডার (Base64)
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        uploadedImageBase64 = event.target.result;
        document.getElementById('upload-text').innerText = 'ছবি যুক্ত হয়েছে ✓';
      };
      reader.readAsDataURL(file);
    }

    // পোস্টার জেনারেশন কল
    async function generatePoster() {
      const promptInput = document.getElementById('prompt-input');
      const generateBtn = document.getElementById('generate-btn');
      const btnText = document.getElementById('btn-text');
      const previewImg = document.getElementById('preview-image');
      const placeholderText = document.getElementById('placeholder-text');

      const text = promptInput.value.trim();
      if (!text) {
        alert('অনুগ্রহ করে বিজ্ঞাপনের কিছু বিবরণ লিখুন!');
        return;
      }

      // লোডিং অবস্থা
      generateBtn.disabled = true;
      btnText.innerText = 'তৈরি হচ্ছে... ⏳';

      try {
        const response = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text,
            templateType: currentTemplate,
            referenceImage: uploadedImageBase64
          })
        });

        const data = await response.json();

        // সঠিক ছবির লিংক না এলে এরর প্রদর্শন (কোনো ব্রোকেন ইমেজ দেখাবে না)
        if (!response.ok || !data.imageUrl || data.imageUrl.length < 5) {
          const errMsg = data.error || (data.full_velona_data ? JSON.stringify(data.full_velona_data) : 'ছবি প্রস্তুত হয়নি');
          alert('সার্ভার থেকে প্রাপ্ত তথ্য:\n' + errMsg);
          return;
        }

        // সফল ছবি ডিসপ্লে
        generatedImageUrl = data.imageUrl;
        previewImg.src = data.imageUrl;
        previewImg.style.display = 'block';
        placeholderText.style.display = 'none';

      } catch (err) {
        alert('কানেকশন এরর: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        btnText.innerText = 'পোস্টার তৈরি ➤';
      }
    }

    // লাইভ করার ফাংশন
    function publishLive() {
      if (!generatedImageUrl) {
        alert('আগে একটি পোস্টার তৈরি করুন!');
        return;
      }
      alert('পোস্টারটি সফলভাবে বিজ্ঞাপন বাজারে লাইভ করার জন্য পাঠানো হয়েছে!');
      window.location.href = 'ads.html';
    }

    // বাতিল করার ফাংশন
    function cancelPreview() {
      const previewImg = document.getElementById('preview-image');
      const placeholderText = document.getElementById('placeholder-text');
      previewImg.src = '';
      previewImg.style.display = 'none';
      placeholderText.style.display = 'block';
      generatedImageUrl = '';
    }
  </script>
</body>
</html>
