<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এআই বিজ্ঞাপন স্টুডিও | Aimanix AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0614;
      --card-bg: rgba(22, 14, 40, 0.7);
      --card-border: rgba(147, 51, 234, 0.3);
      --primary-gradient: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%);
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(126, 34, 206, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 12px 30px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* হেডার ও ব্যাক বাটন */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .back-btn {
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(6, 182, 212, 0.3);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(6, 182, 212, 0.2);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* প্রিভিউ কার্ড */
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .preview-title {
      font-size: 15px;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .preview-box {
      width: 100%;
      height: 480px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 14px;
      padding: 20px;
      line-height: 1.6;
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn-live {
      flex: 2;
      background: #059669;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* ইনপুট ডক */
    .input-dock {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
    }

    .dock-title {
      font-size: 13px;
      color: #c084fc;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .prompt-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      padding: 10px;
      resize: none;
      outline: none;
      height: 80px;
      margin-bottom: 12px;
    }

    .prompt-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .dock-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .upload-label {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      color: #e5e7eb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .upload-label input {
      display: none;
    }

    .generate-btn {
      flex: 1.2;
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s ease;
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- হেডার -->
    <div class="top-nav">
      <a href="ads.html" class="back-btn">
        <span>←</span> বিজ্ঞাপন বাজারে ফিরুন
      </a>
      <span class="brand-title">Aimanix Studio</span>
    </div>

    <!-- প্রিভিউ কার্ড -->
    <div class="preview-card">
      <div class="preview-title">পোস্টার প্রিভিউ</div>
      <div class="preview-box" id="preview-box">
        <span class="placeholder-text" id="placeholder-text">
          নিচে আপনার নিজের ভাষায় প্রম্পট লিখে এআই দিয়ে পোস্টার তৈরি করুন<br>অথবা ফোন থেকে ছবি আপলোড করুন
        </span>
        <img id="preview-image" alt="পোস্টার প্রিভিউ">
      </div>

      <div class="action-group">
        <button class="btn-live" id="live-btn" onclick="publishLive()">✅ বিজ্ঞাপন বাজারে লাইভ করুন</button>
        <button class="btn-cancel" id="cancel-btn" onclick="cancelPreview()">বাতিল</button>
      </div>
    </div>

    <!-- ইনপুট ও কন্ট্রোল ডক -->
    <div class="input-dock">
      <div class="dock-title">পোস্টারের নির্দেশ বা বিবরণ লিখুন:</div>
      <textarea id="prompt-input" class="prompt-input" placeholder="যেমন: একটা পোস্টার তৈরি করুন। যার ব্যাক গ্রাউন্ড হবে নিওন পার্পল লাইট। বড় সুন্দর বাংলা ফন্ট থাকবে 'ফুলবাড়ি আমিনিয়া হাই মাদ্রাসা'..."></textarea>
      
      <div class="dock-actions">
        <!-- অপশন ১: সরাসরি ফোন থেকে আপলোড -->
        <label class="upload-label">
          📁 <span>ফোন থেকে আপলোড</span>
          <input type="file" id="image-upload" accept="image/*" onchange="handleDirectUpload(event)">
        </label>

        <!-- অপশন ২: GPT Image 2.0 এআই দিয়ে তৈরি -->
        <button class="generate-btn" id="generate-btn" onclick="generateWithAI()">
          <span id="btn-text">এআই পোস্টার তৈরি ➤</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    let currentPosterUrl = '';

    // ছবি কম্প্রেস করার ফাংশন (LocalStorage মেমরি বাঁচানোর জন্য)
    async function compressImageForStorage(base64Str) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 1200;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          // কোয়ালিটি বজায় রেখে হালকা সাইজে রূপান্তর
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => resolve(base64Str);
        img.src = base64Str;
      });
    }

    // বিকল্প ১: ফোন/গ্যালারি থেকে সরাসরি আপলোড
    function handleDirectUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        showPreview(event.target.result);
      };
      reader.readAsDataURL(file);
    }

    // বিকল্প ২: ব্যাকএন্ডের মাধ্যমে GPT Image তৈরি (CORS মুক্ত)
    async function generateWithAI() {
      const promptInput = document.getElementById('prompt-input');
      const generateBtn = document.getElementById('generate-btn');
      const btnText = document.getElementById('btn-text');

      const userPrompt = promptInput.value.trim();
      if (!userPrompt) {
        alert('অনুগ্রহ করে পোস্টারের বিবরণ বা প্রম্পট লিখুন!');
        return;
      }

      generateBtn.disabled = true;
      btnText.innerText = 'তৈরি হচ্ছে... ⏳';

      try {
        const response = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: userPrompt })
        });

        const data = await response.json();

        if (!response.ok || !data.imageUrl) {
          alert('সার্ভার থেকে প্রাপ্ত তথ্য:\n' + (data.error || JSON.stringify(data)));
          return;
        }

        showPreview(data.imageUrl);

      } catch (err) {
        alert('কানেকশন সমস্যা: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        btnText.innerText = 'এআই পোস্টার তৈরি ➤';
      }
    }

    // প্রিভিউ প্রদর্শন
    function showPreview(url) {
      currentPosterUrl = url;
      const previewImg = document.getElementById('preview-image');
      const placeholder = document.getElementById('placeholder-text');

      previewImg.src = url;
      previewImg.style.display = 'block';
      placeholder.style.display = 'none';
    }

    // বিজ্ঞাপন বাজারে নিশ্চিতভাবে লাইভ প্রকাশ
    async function publishLive() {
      if (!currentPosterUrl) {
        alert('আগে একটি পোস্টার তৈরি বা আপলোড করুন!');
        return;
      }

      const liveBtn = document.getElementById('live-btn');
      liveBtn.disabled = true;
      liveBtn.innerText = 'পোস্ট হচ্ছে... ⏳';

      try {
        // সাইজ কম্প্রেস করা যাতে লোকালস্টোরেজ কোটা পূর্ণ না হয়
        let finalImage = currentPosterUrl;
        if (currentPosterUrl.startsWith('data:image')) {
          finalImage = await compressImageForStorage(currentPosterUrl);
        }

        const promptText = document.getElementById('prompt-input').value.trim() || 'বিশেষ বিজ্ঞাপন';

        const adData = {
          id: Date.now(),
          title: promptText.substring(0, 45),
          image: finalImage,
          category: 'school',
          publishedAt: new Date().toISOString()
        };

        // ads.html যে নামেই ডেটা লোড করুক না কেন, সব কী-তে পুশ করা
        const storageKeys = ['user_market_ads', 'ads', 'aimanix_ads'];
        storageKeys.forEach(key => {
          let list = [];
          try {
            list = JSON.parse(localStorage.getItem(key) || '[]');
            if (!Array.isArray(list)) list = [];
          } catch (e) {
            list = [];
          }
          list.unshift(adData);
          try {
            localStorage.setItem(key, JSON.stringify(list));
          } catch (storageErr) {
            console.warn(`Storage quota alert on ${key}:`, storageErr);
          }
        });

        sessionStorage.setItem('latest_ad', JSON.stringify(adData));

        alert('পোস্টারটি সফলভাবে বিজ্ঞাপন বাজারে প্রকাশিত হয়েছে!');
        window.location.href = 'ads.html';

      } catch (err) {
        alert('পোস্ট করতে সমস্যা হয়েছে: ' + err.message);
        liveBtn.disabled = false;
        liveBtn.innerText = '✅ বিজ্ঞাপন বাজারে লাইভ করুন';
      }
    }

    // বাতিল
    function cancelPreview() {
      currentPosterUrl = '';
      const previewImg = document.getElementById('preview-image');
      const placeholder = document.getElementById('placeholder-text');

      previewImg.src = '';
      previewImg.style.display = 'none';
      placeholder.style.display = 'block';
      document.getElementById('image-upload').value = '';
    }
  </script>
</body>
</html>
