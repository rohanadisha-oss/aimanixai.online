<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এআই বিজ্ঞাপন স্টুডিও | Aimanix AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0614;
      --card-bg: rgba(22, 14, 40, 0.7);
      --card-border: rgba(147, 51, 234, 0.3);
      --primary-gradient: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%);
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(126, 34, 206, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 12px 30px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* হেডার ও ব্যাক বাটন */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .back-btn {
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* প্রিভিউ উইন্ডো */
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .preview-title {
      font-size: 15px;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .preview-box {
      width: 100%;
      height: 480px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 14px;
      padding: 20px;
      line-height: 1.5;
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn-live {
      flex: 2;
      background: #059669;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* ইনপুট ডক */
    .input-dock {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
    }

    .dock-title {
      font-size: 13px;
      color: #c084fc;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .prompt-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      padding: 10px;
      resize: none;
      outline: none;
      height: 80px;
      margin-bottom: 12px;
    }

    .dock-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .upload-label {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      color: #e5e7eb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .upload-label input {
      display: none;
    }

    .generate-btn {
      flex: 1.2;
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- হেডার -->
    <div class="top-nav">
      <a href="ads.html" class="back-btn">
        <span>←</span> বিজ্ঞাপন বাজারে ফিরুন
      </a>
      <span class="brand-title">Aimanix Studio</span>
    </div>

    <!-- প্রিভিউ বক্স -->
    <div class="preview-card">
      <div class="preview-title">পোস্টার প্রিভিউ</div>
      <div class="preview-box" id="preview-box">
        <span class="placeholder-text" id="placeholder-text">
          নিচে প্রম্পট লিখে এআই দিয়ে পোস্টার তৈরি করুন<br>অথবা ফোন থেকে ছবি আপলোড করুন
        </span>
        <img id="preview-image" alt="পোস্টার প্রিভিউ">
      </div>

      <div class="action-group">
        <button class="btn-live" id="live-btn" onclick="publishLive()">✅ বিজ্ঞাপন বাজারে লাইভ করুন</button>
        <button class="btn-cancel" id="cancel-btn" onclick="cancelPreview()">বাতিল</button>
      </div>
    </div>

    <!-- ইনপুট ও অ্যাকশন ডক -->
    <div class="input-dock">
      <div class="dock-title">পোস্টারের নির্দেশ বা বিবরণ লিখুন:</div>
      <textarea id="prompt-input" class="prompt-input" placeholder="যেমন: একটা পোস্টার তৈরি করুন। যার ব্যাকগ্রাউন্ড হবে নিওন পার্পল লাইট। বড় সুন্দর বাংলা ফন্টে থাকবে 'ফুলবাড়ি আমিনিয়া হাই মাদ্রাসা'..."></textarea>
      
      <div class="dock-actions">
        <!-- ফোন থেকে আপলোড বাটন -->
        <label class="upload-label">
          📁 <span>ফোন থেকে আপলোড</span>
          <input type="file" id="image-upload" accept="image/*" onchange="handleDirectUpload(event)">
        </label>

        <!-- GPT Image 2.0 জেনারেশন বাটন -->
        <button class="generate-btn" id="generate-btn" onclick="generateWithAI()">
          <span id="btn-text">এআই পোস্টার তৈরি ➤</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    let currentPosterUrl = '';

    // বিকল্প ১: ফোন/গ্যালারি থেকে সরাসরি আপলোড
    function handleDirectUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        showPreview(event.target.result);
      };
      reader.readAsDataURL(file);
    }

    // বিকল্প ২: GPT Image 2.0 দিয়ে ছবি তৈরি
    async function generateWithAI() {
      const promptInput = document.getElementById('prompt-input');
      const generateBtn = document.getElementById('generate-btn');
      const btnText = document.getElementById('btn-text');

      const userPrompt = promptInput.value.trim();
      if (!userPrompt) {
        alert('অনুগ্রহ করে পোস্টারের বিবরণ বা প্রম্পট লিখুন!');
        return;
      }

      generateBtn.disabled = true;
      btnText.innerText = 'তৈরি হচ্ছে... ⏳';

      try {
        const response = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: userPrompt })
        });

        const data = await response.json();

        if (!response.ok || !data.imageUrl) {
          alert('সমস্যা: ' + (data.error || 'ছবি প্রস্তুত হয়নি'));
          return;
        }

        showPreview(data.imageUrl);

      } catch (err) {
        alert('সার্ভার এরর: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        btnText.innerText = 'এআই পোস্টার তৈরি ➤';
      }
    }

    // প্রিভিউ ডিসপ্লে
    function showPreview(url) {
      currentPosterUrl = url;
      const previewImg = document.getElementById('preview-image');
      const placeholder = document.getElementById('placeholder-text');

      previewImg.src = url;
      previewImg.style.display = 'block';
      placeholder.style.display = 'none';
    }

    // বিজ্ঞাপন বাজারে প্রকাশ
    function publishLive() {
      if (!currentPosterUrl) {
        alert('আগে একটি পোস্টার তৈরি বা আপলোড করুন!');
        return;
      }

      const promptText = document.getElementById('prompt-input').value.trim() || 'বিজ্ঞাপন পোস্টার';

      const adData = {
        title: promptText.substring(0, 45),
        image: currentPosterUrl,
        publishedAt: new Date().toISOString()
      };

      const allAds = JSON.parse(localStorage.getItem('user_market_ads') || '[]');
      allAds.unshift(adData);
      localStorage.setItem('user_market_ads', JSON.stringify(allAds));

      alert('পোস্টারটি সফলভাবে বিজ্ঞাপন বাজারে প্রকাশিত হয়েছে!');
      window.location.href = 'ads.html';
    }

    // বাতিল
    function cancelPreview() {
      currentPosterUrl = '';
      const previewImg = document.getElementById('preview-image');
      const placeholder = document.getElementById('placeholder-text');

      previewImg.src = '';
      previewImg.style.display = 'none';
      placeholder.style.display = 'block';
      document.getElementById('image-upload').value = '';
    }
  </script>
</body>
</html>
