<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এআই বিজ্ঞাপন স্টুডিও | Aimanix AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Bengali:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase Compat Libraries (App, Firestore & Auth) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0a0614;
      --card-bg: rgba(22, 14, 40, 0.75);
      --card-border: rgba(147, 51, 234, 0.3);
      --primary-gradient: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%);
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(126, 34, 206, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 12px 50px;
    }

    /* =========================================
       Firebase Email/Password Auth Modal
       ========================================= */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 3, 20, 0.96);
      backdrop-filter: blur(25px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: rgba(26, 14, 48, 0.95);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 24px;
      padding: 2.2rem 1.8rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(168, 85, 247, 0.2);
    }

    .auth-icon {
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
      display: inline-block;
    }

    .auth-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .auth-sub {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 1.6rem;
    }

    .auth-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 1.4rem;
    }

    .auth-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .auth-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }

    .auth-btn {
      width: 100%;
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(126, 34, 206, 0.4);
      transition: all 0.2s ease;
    }

    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-btn:active {
      transform: scale(0.97);
    }

    .auth-error {
      color: #f87171;
      font-size: 0.88rem;
      margin-top: 0.9rem;
      display: none;
      line-height: 1.4;
    }

    /* মূল অ্যাপ কন্টেইনার */
    .container {
      max-width: 480px;
      margin: 0 auto;
      display: none; /* লগইন না হওয়া পর্যন্ত লুকানো থাকবে */
    }

    /* হেডার ও ব্যাক বাটন */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn {
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(6, 182, 212, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(6, 182, 212, 0.3);
      transition: all 0.2s ease;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #fff;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* প্রিভিউ কার্ড */
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .preview-title {
      font-size: 15px;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .preview-box {
      width: 100%;
      height: 480px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 14px;
      padding: 20px;
      line-height: 1.6;
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn-live {
      flex: 2;
      background: #059669;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* ইনপুট ডক */
    .input-dock {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
      margin-bottom: 25px;
    }

    .dock-title {
      font-size: 13px;
      color: #c084fc;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .prompt-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      padding: 10px;
      resize: none;
      outline: none;
      height: 80px;
      margin-bottom: 12px;
    }

    .prompt-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .dock-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .upload-label {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      color: #e5e7eb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .upload-label input {
      display: none;
    }

    .generate-btn {
      flex: 1.2;
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s ease;
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* পোস্টার ম্যানেজমেন্ট ও ডিলিট সেকশন */
    .manage-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
    }

    .manage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .manage-title {
      font-size: 15px;
      font-weight: 700;
      color: #facc15;
    }

    .manage-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .manage-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .item-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fff;
    }

    .empty-msg {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <!-- =========================================
       Firebase Email/Password Auth Modal
       ========================================= -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="auth-icon">🔐</div>
      <h2 class="auth-title">স্টুডিও অ্যাডমিন লগইন</h2>
      <p class="auth-sub">আপনার রেজিস্টার্ড Firebase অ্যাডমিন ইমেল ও পাসওয়ার্ড দিন</p>
      
      <div class="auth-input-group">
        <input type="email" id="auth-email-input" class="auth-input" placeholder="অ্যাডমিন ইমেল (Admin Email)..." autocomplete="email">
        <input type="password" id="auth-pass-input" class="auth-input" placeholder="পাসওয়ার্ড (Password)..." autocomplete="current-password" onkeydown="if(event.key === 'Enter') handleFirebaseAuthLogin()">
      </div>

      <button class="auth-btn" id="auth-submit-btn" onclick="handleFirebaseAuthLogin()">লগইন করুন ➤</button>
      <div id="auth-error-msg" class="auth-error"></div>
    </div>
  </div>

  <!-- মূল স্টুডিও কন্টেইনার (অথেনটিকেশন সফল হলে লোড হবে) -->
  <div class="container" id="main-studio-app">
    
    <!-- হেডার -->
    <div class="top-nav">
      <div class="nav-left-group">
        <a href="ads.html" class="back-btn">
          <span>←</span> বিজ্ঞাপন বাজারে ফিরুন
        </a>
        <button class="btn-logout" onclick="handleFirebaseAuthLogout()">🔒 লগআউট</button>
      </div>
      <span class="brand-title">Aimanix Studio</span>
    </div>

    <!-- প্রিভিউ কার্ড -->
    <div class="preview-card">
      <div class="preview-title">পোস্টার প্রিভিউ</div>
      <div class="preview-box" id="preview-box">
        <span class="placeholder-text" id="placeholder-text">
          নিচে প্রম্পট লিখে এআই দিয়ে পোস্টার তৈরি করুন<br>অথবা ফোন থেকে ছবি আপলোড করুন
        </span>
        <img id="preview-image" alt="পোস্টার প্রিভিউ">
      </div>

      <div class="action-group">
        <button class="btn-live" id="live-btn" onclick="publishLive()">✅ বিজ্ঞাপন বাজারে লাইভ করুন</button>
        <button class="btn-cancel" id="cancel-btn" onclick="cancelPreview()">বাতিল / মুছুন</button>
      </div>
    </div>

    <!-- ইনপুট ও কন্ট্রোল ডক -->
    <div class="input-dock">
      <div class="dock-title">পোস্টারের নির্দেশ বা বিবরণ লিখুন:</div>
      <textarea id="prompt-input" class="prompt-input" placeholder="যেমন: একটা পোস্টার তৈরি করুন। যার ব্যাকগ্রাউন্ড হবে নিওন পার্পল। বড় সুন্দর ফন্টে থাকবে 'ফুলবাড়ি আমিনিয়া হাই মাদ্রাসা'..."></textarea>
      
      <div class="dock-actions">
        <!-- অপশন ১: ফোন থেকে সরাসরি আপলোড -->
        <label class="upload-label">
          📁 <span>ফোন থেকে আপলোড</span>
          <input type="file" id="image-upload" accept="image/*" onchange="handleDirectUpload(event)">
        </label>

        <!-- অপশন ২: মুক্ত প্রম্পট এআই তৈরি -->
        <button class="generate-btn" id="generate-btn" onclick="generateWithAI()">
          <span id="btn-text">এআই পোস্টার তৈরি ➤</span>
        </button>
      </div>
    </div>

    <!-- প্রকাশিত পোস্টার ডিলিট ও ম্যানেজমেন্ট সেকশন -->
    <div class="manage-section">
      <div class="manage-header">
        <span class="manage-title">🗑️ প্রকাশিত পোস্টার মুছুন</span>
        <button onclick="loadPublishedAds()" style="background:none; border:none; color:#38bdf8; font-size:12px; cursor:pointer;">🔄 রিফ্রেশ</button>
      </div>
      <div class="manage-list" id="manage-list">
        <div class="empty-msg">পোস্টার লোড হচ্ছে...</div>
      </div>
    </div>

  </div>

  <script>
    // ==========================================================
    // 1. ফায়ারবেস কনফিগারেশন ও অথেনটিকেশন ইনিশিয়ালাইজেশন
    // ==========================================================
    const firebaseConfig = {
      authDomain: "aimanix-web.firebaseapp.com",
      projectId: "aimanix-web",
      storageBucket: "aimanix-web.appspot.com"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Firebase Auth State Listener (admin.html এর সাথে নিখুঁত সিঙ্ক)
    auth.onAuthStateChanged((user) => {
      const overlay = document.getElementById("auth-overlay");
      const appContainer = document.getElementById("main-studio-app");

      if (user) {
        // লগইন থাকলে লকস্ক্রিন বন্ধ হয়ে স্টুডিও খুলবে
        overlay.style.display = "none";
        appContainer.style.display = "block";
        loadPublishedAds();
      } else {
        // লগআউট থাকলে লকস্ক্রিন চলে আসবে
        overlay.style.display = "flex";
        appContainer.style.display = "none";
        document.getElementById("auth-email-input").focus();
      }
    });

    // Firebase Email/Password Login Function
    async function handleFirebaseAuthLogin() {
      const emailInput = document.getElementById("auth-email-input");
      const passInput = document.getElementById("auth-pass-input");
      const submitBtn = document.getElementById("auth-submit-btn");
      const errorMsg = document.getElementById("auth-error-msg");

      const email = emailInput.value.trim();
      const password = passInput.value.trim();

      if (!email || !password) {
        errorMsg.innerText = "অনুগ্রহ করে ইমেল ও পাসওয়ার্ড উভয়ই লিখুন।";
        errorMsg.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "যাচাই হচ্ছে... ⏳";
      errorMsg.style.display = "none";

      try {
        await auth.signInWithEmailAndPassword(email, password);
        // সফল হলে onAuthStateChanged স্বয়ংক্রিয়ভাবে পেজ আনলক করবে
      } catch (error) {
        let bengaliErr = "লগইন ব্যর্থ হয়েছে: " + error.message;
        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          bengaliErr = "ভুল ইমেল অথবা পাসওয়ার্ড! অনুগ্রহ করে সঠিক তথ্য দিন।";
        } else if (error.code === 'auth/invalid-email') {
          bengaliErr = "ইমেল ফরম্যাটটি সঠিক নয়।";
        }
        errorMsg.innerText = bengaliErr;
        errorMsg.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "লগইন করুন ➤";
      }
    }

    // Firebase Logout Function
    async function handleFirebaseAuthLogout() {
      try {
        await auth.signOut();
      } catch (err) {
        alert("লগআউট ব্যর্থ: " + err.message);
      }
    }

    // ==========================================================
    // 2. স্টুডিও কোর ইঞ্জিন (ইমেজ জেনারেশন ও ম্যানেজমেন্ট)
    // ==========================================================
    let currentPosterUrl = '';

    // ছবি কম্প্রেস করার ফাংশন (মেমরি ও ডেটাবেজ সেভিং)
    async function compressImageForStorage(base64Str) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 1000;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => resolve(base64Str);
        img.src = base64Str;
      });
    }

    // ১. ফোন থেকে সরাসরি ছবি আপলোড
    function handleDirectUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        showPreview(event.target.result);
      };
      reader.readAsDataURL(file);
    }

    // ২. ব্যাকএন্ড এপিআই দিয়ে এআই পোস্টার তৈরি
    async function generateWithAI() {
      const promptInput = document.getElementById('prompt-input');
      const generateBtn = document.getElementById('generate-btn');
      const btnText = document.getElementById('btn-text');

      const userPrompt = promptInput.value.trim();
      if (!userPrompt) {
        alert('অনুগ্রহ করে পোস্টারের বিবরণ বা প্রম্পট লিখুন!');
        return;
      }

      generateBtn.disabled = true;
      btnText.innerText = 'তৈরি হচ্ছে... ⏳';

      try {
        const response = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: userPrompt })
        });

        const data = await response.json();

        if (!response.ok || !data.imageUrl) {
          alert('সমস্যা: ' + (data.error || 'ছবি প্রস্তুত হয়নি'));
          return;
        }

        showPreview(data.imageUrl);

      } catch (err) {
        alert('কানেকশন সমস্যা: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        btnText.innerText = 'এআই পোস্টার তৈরি ➤';
      }
    }

    // প্রিভিউ ডিসপ্লে
    function showPreview(url) {
      currentPosterUrl = url;
      const previewImg = document.getElementById('preview-image');
      const placeholder = document.getElementById('placeholder-text');

      previewImg.src = url;
      previewImg.style.display = 'block';
      placeholder.style.display = 'none';
    }

    // প্রিভিউ বাতিল ও স্ক্রিন পরিষ্কার
    function cancelPreview() {
      currentPosterUrl = '';
      const previewImg = document.getElementById('preview-image');
      const placeholder = document.getElementById('placeholder-text');

      previewImg.src = '';
      previewImg.style.display = 'none';
      placeholder.style.display = 'block';
      document.getElementById('image-upload').value = '';
    }

    // বিজ্ঞাপন বাজারে লাইভ পোস্ট (Firebase + LocalStorage Sync)
    async function publishLive() {
      if (!currentPosterUrl) {
        alert('আগে একটি পোস্টার তৈরি বা আপলোড করুন!');
        return;
      }

      const liveBtn = document.getElementById('live-btn');
      liveBtn.disabled = true;
      liveBtn.innerText = 'পোস্ট হচ্ছে... ⏳';

      try {
        let finalImage = currentPosterUrl;
        if (currentPosterUrl.startsWith('data:image')) {
          finalImage = await compressImageForStorage(currentPosterUrl);
        }

        const promptText = document.getElementById('prompt-input').value.trim() || 'বিশেষ বিজ্ঞাপন ব্যানার';

        const newAd = {
          title: promptText.substring(0, 50),
          desc: promptText,
          imageUrl: finalImage,
          badge: 'NEW AD',
          type: 'poster',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        // ১. ফায়ারবেস ডাটাবেজে সংরক্ষণ
        const docRef = await db.collection("ads").add(newAd);

        // ২. লোকাল স্টোরেজে সংরক্ষণ
        const storageKeys = ["aimanix_ad_posters", "user_market_ads", "ads"];
        storageKeys.forEach(k => {
          try {
            let list = JSON.parse(localStorage.getItem(k) || "[]");
            list.unshift({
              id: docRef.id,
              title: newAd.title,
              desc: newAd.desc,
              imageUrl: newAd.imageUrl,
              badge: newAd.badge
            });
            localStorage.setItem(k, JSON.stringify(list));
          } catch(e) {}
        });

        alert('পোস্টারটি সফলভাবে বিজ্ঞাপন বাজারে লাইভ করা হয়েছে!');
        cancelPreview();
        loadPublishedAds();

      } catch (err) {
        alert('বিজ্ঞাপন বাজারে প্রকাশে সমস্যা হয়েছে: ' + err.message);
      } finally {
        liveBtn.disabled = false;
        liveBtn.innerText = '✅ বিজ্ঞাপন বাজারে লাইভ করুন';
      }
    }

    // প্রকাশিত পোস্টারগুলো লোড করা
    async function loadPublishedAds() {
      const manageList = document.getElementById('manage-list');
      if (!manageList) return;
      manageList.innerHTML = '<div class="empty-msg">পোস্টার লোড হচ্ছে...</div>';

      let ads = [];
      const seenUrls = new Set();

      // ১. ফায়ারবেস থেকে পড়া
      try {
        const snap = await db.collection("ads").orderBy("createdAt", "desc").limit(20).get();
        if (!snap.empty) {
          snap.forEach(doc => {
            const data = doc.data();
            const img = data.imageUrl || data.image || '';
            if (img && !seenUrls.has(img)) {
              seenUrls.add(img);
              ads.push({ id: doc.id, title: data.title || 'বিজ্ঞাপন ব্যানার', imageUrl: img, isFirebase: true });
            }
          });
        }
      } catch (err) {
        console.warn("ফায়ারবেস লোড নোটিশ:", err);
      }

      // ২. লোকাল স্টোরেজ থেকে পড়া
      const storageKeys = ["aimanix_ad_posters", "user_market_ads", "ads", "admin_ads"];
      storageKeys.forEach(k => {
        try {
          const list = JSON.parse(localStorage.getItem(k) || "[]");
          if (Array.isArray(list)) {
            list.forEach(item => {
              const img = item.imageUrl || item.image || '';
              if (img && !seenUrls.has(img)) {
                seenUrls.add(img);
                ads.push({ id: item.id || ('local_' + Math.random()), title: item.title || 'বিজ্ঞাপন ব্যানার', imageUrl: img, isFirebase: false });
              }
            });
          }
        } catch(e) {}
      });

      if (ads.length === 0) {
        manageList.innerHTML = '<div class="empty-msg">কোনো পোস্টার পাওয়া যায়নি।</div>';
        return;
      }

      manageList.innerHTML = ads.map(ad => `
        <div class="manage-item" id="item-${ad.id}">
          <div class="item-info">
            <img src="${ad.imageUrl}" class="item-thumb" alt="thumb">
            <div class="item-title">${escapeHtml(ad.title || 'বিজ্ঞাপন ব্যানার')}</div>
          </div>
          <button class="btn-delete" onclick="deleteAd('${ad.id}', '${encodeURIComponent(ad.imageUrl)}', ${ad.isFirebase})">
            🗑️ ডিলিট
          </button>
        </div>
      `).join('');
    }

    // পোস্টার স্থায়ীভাবে মুছে ফেলার লজিক
    async function deleteAd(adId, encodedUrl, isFirebase) {
      if (!confirm("আপনি কি নিশ্চিত এই পোস্টারটি বিজ্ঞাপন বাজার থেকে চিরতরে মুছে ফেলতে চান?")) {
        return;
      }

      const targetUrl = decodeURIComponent(encodedUrl);
      const itemEl = document.getElementById(`item-${adId}`);
      if (itemEl) itemEl.style.opacity = '0.3';

      try {
        // ১. ফায়ারবেস থেকে সরাসরি আইডি এবং ইমেজ দিয়ে ডিলিট
        if (isFirebase) {
          try {
            await db.collection("ads").doc(adId).delete();
          } catch(e) {}

          try {
            const querySnap = await db.collection("ads").where("imageUrl", "==", targetUrl).get();
            querySnap.forEach(async (doc) => {
              await doc.ref.delete();
            });
          } catch(e) {}
        }

        // ২. ব্রাউজারের সমস্ত লোকাল স্টোরেজ থেকে পরিষ্কার করা
        const keys = ["aimanix_ad_posters", "user_market_ads", "ads", "admin_ads"];
        keys.forEach(key => {
          try {
            let list = JSON.parse(localStorage.getItem(key) || "[]");
            if (Array.isArray(list)) {
              list = list.filter(item => {
                const itemImg = item.imageUrl || item.image;
                return item.id !== adId && itemImg !== targetUrl;
              });
              localStorage.setItem(key, JSON.stringify(list));
            }
          } catch(e) {}
        });

        sessionStorage.removeItem('latest_ad');

        if (itemEl) itemEl.remove();

        alert("পোস্টারটি সফলভাবে মুছে ফেলা হয়েছে!");

      } catch (err) {
        alert("ডিলিট করতে সমস্যা হয়েছে: " + err.message);
        if (itemEl) itemEl.style.opacity = '1';
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
