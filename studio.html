<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>এআই পোস্টার স্টুডিও | Aimanix Studio</title>
  
  <!-- Firebase Compat লাইব্রেরি (শুধুমাত্র ডাটাবেজে পোস্টের জন্য) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070314;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* লগইন বক্স */
    #authContainer {
      background: #110826;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 32px 24px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(168, 85, 247, 0.2);
      text-align: center;
    }
    #authContainer h2 { font-size: 20px; color: #c084fc; margin-bottom: 6px; }
    #authContainer p { font-size: 13px; color: #9ca3af; margin-bottom: 22px; }
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
    .input-group input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #374151;
      background: #190e38; color: #fff; font-size: 14px; outline: none;
    }
    .input-group input:focus { border-color: #a855f7; }
    .btn-login {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #7c3aed, #d946ef);
      color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(217, 70, 239, 0.4);
    }

    /* স্টুডিও ড্যাশবোর্ড */
    #studioDashboard {
      display: none;
      width: 100%;
      max-width: 500px;
      padding-bottom: 110px;
    }
    .top-bar-admin {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.25);
    }
    .top-bar-admin h1 { font-size: 18px; color: #c084fc; }
    .btn-logout {
      background: #374151; color: #ef4444; border: none;
      padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    .templates-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
    }
    .card {
      background: #140830; border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 16px;
      padding: 14px; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .card.active { border-color: #d946ef; background: #260c50; box-shadow: 0 0 15px rgba(217, 70, 239, 0.3); }
    .card-icon { font-size: 26px; margin-bottom: 4px; }
    .card-name { font-size: 13px; font-weight: bold; color: #f1f5f9; }

    /* প্রিভিউ বক্স */
    #previewBox {
      display: none; background: #140830; border-radius: 18px;
      padding: 16px; text-align: center; margin-bottom: 20px; border: 1px solid #38bdf8;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #previewBox img {
      width: 100%; max-height: 480px; object-fit: contain;
      border-radius: 14px; display: block; margin: 0 auto;
    }
    .action-btns {
      margin-top: 14px; display: flex; gap: 10px; justify-content: center;
    }
    .btn-pub {
      background: #059669; color: #fff; border: none; padding: 10px 20px;
      border-radius: 10px; font-weight: bold; cursor: pointer;
    }
    .btn-can {
      background: #dc2626; color: #fff; border: none; padding: 10px 14px;
      border-radius: 10px; cursor: pointer;
    }

    /* ফ্লোটিং বটম বার */
    .bottom-bar {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 480px; background: #110826;
      border: 1px solid #a855f7; border-radius: 999px; padding: 6px 14px;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .bottom-bar input {
      flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px;
    }
    .submit-btn {
      background: #d946ef; color: #fff; border: none; width: 38px; height: 38px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px;
    }
  </style>
</head>
<body>

<!-- লগইন স্ক্রিন -->
<div id="authContainer">
  <h2>🔐 এআই স্টুডিও লগইন</h2>
  <p>আপনার অ্যাডমিন পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
  <div class="input-group">
    <label>অ্যাডমিন পাসওয়ার্ড / সিক্রেট পিন</label>
    <input type="password" id="adminPassInput" placeholder="আপনার অ্যাডমিন পাসওয়ার্ড দিন" required />
  </div>
  <button class="btn-login" id="btnLogin" onclick="handleAdminLogin()">প্রবেশ করুন</button>
</div>

<!-- স্টুডিও ড্যাশবোর্ড -->
<div id="studioDashboard">
  <div class="top-bar-admin">
    <h1>✨ এআই পোস্টার স্টুডিও</h1>
    <div style="display:flex; gap:8px;">
      <a href="ads.html" target="_blank" style="background:#2e1065; color:#c084fc; text-decoration:none; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:bold; border:1px solid #7c3aed;">বাজার দেখুন ↗</a>
      <button class="btn-logout" onclick="handleAdminLogout()">লগআউট</button>
    </div>
  </div>

  <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 10px;">ডিজাইন টেমপ্লেট নির্বাচন করুন:</div>
  <div class="templates-grid">
    <div class="card active" onclick="setTemplate('ad_poster', 'POSTER', this)">
      <div class="card-icon">🏛️</div>
      <div class="card-name">স্কুল/প্রতিষ্ঠান ব্যানার</div>
    </div>
    <div class="card" onclick="setTemplate('shop_offer', 'OFFER', this)">
      <div class="card-icon">🛍️</div>
      <div class="card-name">দোকান ও অফার ব্যানার</div>
    </div>
  </div>

  <!-- লাইভ প্রিভিউ -->
  <div id="previewBox">
    <h3 style="color: #38bdf8; font-size: 15px; margin-bottom: 10px;">পোস্টার প্রিভিউ</h3>
    <img id="posterResultImg" src="" alt="Poster Preview" />
    <div class="action-btns">
      <button class="btn-pub" onclick="publishToAdsMarket()">✅ বিজ্ঞাপন বাজারে লাইভ করুন</button>
      <button class="btn-can" onclick="document.getElementById('previewBox').style.display='none'">বাতিল</button>
    </div>
  </div>

  <!-- ইনপুট বার -->
  <div class="bottom-bar">
    <input type="text" id="promptText" placeholder="পোস্টারের বিবরণ বা প্রতিষ্ঠানের নাম লিখুন..." />
    <button class="submit-btn" id="generateBtn" onclick="generatePoster()">➤</button>
  </div>
</div>

<script>
  // ১. ফায়ারবেস ডেটাবেজ ইনিশিয়ালাইজেশন
  var firebaseConfig = {
    projectId: "aimanix-web"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  var db = firebase.firestore();

  // ২. স্বয়ংক্রিয় অ্যাডমিন সেশন চেক (admin.html-এ লগইন থাকলে এটিও সরাসরি খুলে যাবে)
  function checkSession() {
    var isAdmin = localStorage.getItem("aimanix_admin_logged") || sessionStorage.getItem("admin_session");
    if (isAdmin === "true") {
      document.getElementById("authContainer").style.display = "none";
      document.getElementById("studioDashboard").style.display = "block";
      document.body.style.alignItems = "flex-start";
    } else {
      document.getElementById("authContainer").style.display = "block";
      document.getElementById("studioDashboard").style.display = "none";
      document.body.style.alignItems = "center";
    }
  }
  checkSession();

  // ৩. অ্যাডমিন লগইন হ্যান্ডলার
  function handleAdminLogin() {
    var pass = document.getElementById("adminPassInput").value.trim();

    if (!pass) {
      alert("পাসওয়ার্ড লিখুন!");
      return;
    }

    // আপনার অ্যাডমিন প্যানেলের পাসওয়ার্ড
    localStorage.setItem("aimanix_admin_logged", "true");
    sessionStorage.setItem("admin_session", "true");
    checkSession();
  }

  function handleAdminLogout() {
    localStorage.removeItem("aimanix_admin_logged");
    sessionStorage.removeItem("admin_session");
    location.reload();
  }

  var selectedTemplate = "ad_poster";
  var selectedBadge = "POSTER";
  var finalPosterUrl = "";

  function setTemplate(type, badge, el) {
    selectedTemplate = type;
    selectedBadge = badge;
    document.querySelectorAll('.card').forEach(function(c) {
      c.classList.remove('active');
    });
    el.classList.add('active');
  }

  // ৪. এআই পোস্টার তৈরি
  async function generatePoster() {
    var prompt = document.getElementById("promptText").value.trim();
    var btn = document.getElementById("generateBtn");

    if (!prompt) {
      alert("পোস্টারের বিবরণ লিখুন!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳";

    try {
      var res = await fetch("/api/generate-image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompt, templateType: selectedTemplate })
      });

      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "ছবি তৈরি করা যায়নি");

      finalPosterUrl = data.imageUrl;
      document.getElementById("posterResultImg").src = finalPosterUrl;
      document.getElementById("previewBox").style.display = "block";
      window.scrollTo({ top: document.getElementById("previewBox").offsetTop - 20, behavior: 'smooth' });
    } catch (err) {
      alert("ত্রুটি: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "➤";
    }
  }

  // ৫. বিজ্ঞাপন বাজারে সেভ
  async function publishToAdsMarket() {
    if (!finalPosterUrl) return;
    var promptValue = document.getElementById("promptText").value.trim();

    try {
      await db.collection("ads").add({
        title: promptValue.slice(0, 50) || "বিজ্ঞাপন ব্যানার",
        desc: promptValue,
        imageUrl: finalPosterUrl,
        badge: selectedBadge,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert("🎉 বিজ্ঞাপন বাজারে পোস্টার সফলভাবে প্রকাশিত হয়েছে!");
      document.getElementById("previewBox").style.display = "none";
      document.getElementById("promptText").value = "";
    } catch (err) {
      alert("পাবলিশ ব্যর্থ: " + err.message);
    }
  }
</script>
</body>
</html>
